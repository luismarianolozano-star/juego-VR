<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Juego VR</title>
    
    <!-- Servidor oficial de distribución global de A-Frame -->
    <script src="https://aframe.io"></script>
    
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background-color: #000000; }
    </style>
  </head>
  <body>

    <a-scene embedded>
      <!-- Entorno Visual -->
      <a-sky color="#1A1A2E"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#16213E"></a-plane>

      <!-- Esferas iniciales fijas -->
      <a-sphere class="objetos" position="-1.5 1.5 -3" radius="0.4" color="#E94560"></a-sphere>
      <a-sphere class="objetos" position="0 1.8 -4" radius="0.4" color="#E94560"></a-sphere>
      <a-sphere class="objetos" position="1.5 1.2 -3" radius="0.4" color="#E94560"></a-sphere>

      <!-- Cámara y Cursor de mirada -->
      
        
        
      
    </a-scene>

    <!-- Script de control a prueba de fallos de inicialización -->
    <script>
      // 1. Escuchamos el evento nativo de la escena: 'render-target-loaded'
      // Esto garantiza que la librería ya descargó, compiló y el motor 3D está corriendo.
      document.querySelector('a-scene').addEventListener('render-target-loaded', function () {
        
        // 2. Buscamos todas las esferas del escenario
        var esferas = document.querySelectorAll('.objetos');

        // 3. Asignamos la lógica de movimiento usando JavaScript puro
        esferas.forEach(function(esfera) {
          esfera.addEventListener('click', function () {
            
            // Calculamos nuevas coordenadas aleatorias
            var nuevoX = (Math.random() * 6) - 3; 
            var nuevoY = (Math.random() * 3) + 0.5; 
            var nuevoZ = (Math.random() * -4) - 2; 

            // Aplicamos la nueva posición a la esfera seleccionada
            esfera.setAttribute('position', {x: nuevoX, y: nuevoY, z: nuevoZ});
            
            // Cambiamos el color dinámicamente
            var colores = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3'];
            var colorAleatorio = colores[Math.floor(Math.random() * colores.length)];
            esfera.setAttribute('color', colorAleatorio);
          });
        });

        console.log("¡Lógica de juego VR iniciada con éxito!");
      });
    </script>

  </body>
</html>
